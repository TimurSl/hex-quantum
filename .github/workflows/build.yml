name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read Hex Casting pin
        id: hex
        run: echo "commit=$(grep '^hexcasting_commit=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Hex Casting jar
        id: hexcache
        uses: actions/cache@v4
        with:
          path: libs/hexcasting-neoforge-*.jar
          key: hexcasting-neoforge-${{ steps.hex.outputs.commit }}

      # Hex Casting's 1.21 development builds are not on Maven, so build the pinned commit once and cache it.
      - name: Build Hex Casting from source
        if: steps.hexcache.outputs.cache-hit != 'true'
        run: bash tools/build-hexcasting.sh

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Collect release jars
        run: |
          mkdir -p dist
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-dev-*.jar' -exec cp {} dist/ \;
          ls -l dist

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: hexquantum-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
