org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=hexquantum
mod_name=HexQuantum
mod_version=0.1.0
mod_group=io.github.timursl.hexquantum
mod_authors=TimurSl
mod_license=All-Rights-Reserved
mod_description=A Hex Casting addon about illusions, echoes, phantoms, pocket space and quantum media.

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
# Vanilla-only toolchain used to compile the loader-independent "common" project.
neo_form_version=1.21.1-20240808.144430
neo_version=21.1.234
neo_version_range=[21.1.172,)
moddev_version=2.0.148

# Hex Casting has no stable 1.21.1 release, and its 1.21 development builds are not published to Maven.
# The build uses libs/hexcasting-neoforge-1.21.1-<hexcasting_version>.jar; tools/build-hexcasting.sh (run by CI)
# builds it from hexcasting_commit, the 1.21-branch commit of development build 0.12.0-devel-pre-53.
hexcasting_version=0.12.0-devel-pre-53
hexcasting_commit=32c65158c2fba61aa281bd460330435c6f7ea5d2
hexcasting_version_range=[0.12,)

# Compile-only helpers
kotlin_version=2.2.21
mixin_version=0.8.5

# Dev-runtime only (runClient / runServer); not needed for ./gradlew build
paucal_version=0.7.1-pre-27
patchouli_version=1.21-88-NEOFORGE-SNAPSHOT
inline_version=1.21.1-1.2.2-74
caelus_version=7.0.1+1.21.1
kotlinforforge_version=5.8.0
clothconfig_version=15.0.140
